<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Car Dodger</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px 6px #000;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.92);
      color: white;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      display: none;
      z-index: 200;
      min-width: 320px;
    }
    button {
      padding: 18px 40px;
      background: #00aa00;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Speed: <span id="speed">30</span></div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Your score: <span id="finalScore">0</span></p>
    <p>Be Indian driver 😉</p>
    <button onclick="location.reload()">RESTART</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, roadMesh, car, clock;
    let score = 0, level = 1, roadSpeed = 30;
    let carTargetX = 0, carCurrentX = 0;
    const roadHalfWidth = 10;
    let isNight = false;
    let gameOver = false;
    let gameStarted = false;

    function init() {
      scene = new THREE.Scene();
      updateFog();

      camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 5.5, 12); // closer & lower for car driving feel

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0x80a0ff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(10, 25, 15);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Road – clean asphalt look
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#222222'; ctx.fillRect(0,0,1024,1024);
      ctx.fillStyle = '#ffffff';
      for (let y = 0; y < 1024; y += 180) {
        ctx.fillRect(480, y, 64, 100);
      }
      const roadTexture = new THREE.CanvasTexture(canvas);
      roadTexture.wrapS = roadTexture.wrapT = THREE.RepeatWrapping;
      roadTexture.repeat.set(4, 160);
      roadTexture.generateMipmaps = false;
      roadTexture.minFilter = THREE.LinearFilter;

      const roadGeometry = new THREE.PlaneGeometry(20, 600);
      roadMesh = new THREE.Mesh(roadGeometry, new THREE.MeshLambertMaterial({ map: roadTexture }));
      roadMesh.rotation.x = -Math.PI / 2;
      scene.add(roadMesh);

      // Car (single model)
      const loader = new GLTFLoader();
      loader.load('assets/car.glb', (gltf) => {
        car = gltf.scene;
        car.scale.set(4.8, 4.8, 4.8);      // tuned size – adjust if needed
        car.position.set(0, 2.2, 0);       // raised slightly
        car.rotation.y = Math.PI;          // face forward
        car.castShadow = true;
        scene.add(car);
        gameStarted = true;
        console.log("Car loaded successfully");
      }, undefined, err => console.error("Car load error:", err));

      clock = new THREE.Clock();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (gameStarted && !gameOver && car) {
        roadMesh.position.z += roadSpeed * delta;
        if (roadMesh.position.z > 300) roadMesh.position.z -= 600;

        carCurrentX = THREE.MathUtils.lerp(carCurrentX, carTargetX, 0.22);
        carCurrentX = THREE.MathUtils.clamp(carCurrentX, -roadHalfWidth, roadHalfWidth);
        car.position.x = carCurrentX;
        car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, (carTargetX - carCurrentX) * 0.12, 0.3);

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, carCurrentX * 0.65, 0.16);
        camera.lookAt(carCurrentX, 4, car.position.z - 14);

        score += delta * 100;
        document.getElementById('score').textContent = Math.floor(score);
        document.getElementById('speed').textContent = Math.floor(roadSpeed);

        if (score > level * 1000) {
          level++;
          roadSpeed += 6;
          document.getElementById('level').textContent = level;
        }

        // Day/night
        const elapsed = clock.getElapsedTime();
        const cycle = Math.floor(elapsed / 20) % 2;
        if (cycle !== (isNight ? 1 : 0)) {
          isNight = !isNight;
          updateFog();
          const dirLight = scene.children.find(c => c.type === 'DirectionalLight');
          if (dirLight) dirLight.color.setHSL(isNight ? 0.58 : 0.55, 1, isNight ? 0.4 : 0.8);
        }
      }

      renderer.render(scene, camera);
    }

    function updateFog() {
      scene.fog = new THREE.Fog(isNight ? 0x191970 : 0x87CEEB, 50, 300);
    }

    // Controls (arrows or A/D)
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') carTargetX -= 2.8;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') carTargetX += 2.8;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
