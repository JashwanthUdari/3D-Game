<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Snake Runner</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Length: <span id="length">1</span></div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <p>You ate <span id="ratsEaten">0</span> rats!</p>
    <button onclick="location.reload()">RESTART</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, roadMesh, snakeHead, clock;
    let isNight = false, score = 0, snakeLength = 1;
    let snakeTargetX = 0;
    let snakeCurrentX = 0;
    const roadHalfWidth = 10;
    let bodySegments = [];
    let rats = [];
    let spawnTimer = 0;
    let gameOver = false;
    let gameStarted = false;

    function init() {
      scene = new THREE.Scene();
      updateFog();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 15);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0x80a0ff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Road (procedural, seam-fixed)
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0,0,1024,1024);
      ctx.fillStyle = '#ffffff';
      for (let y = 0; y < 1024; y += 200) {
        ctx.fillRect(480, y, 64, 120);
      }
      const roadTexture = new THREE.CanvasTexture(canvas);
      roadTexture.wrapS = roadTexture.wrapT = THREE.RepeatWrapping;
      roadTexture.repeat.set(4, 160);
      roadTexture.generateMipmaps = false;
      roadTexture.minFilter = THREE.LinearFilter;

      const roadGeometry = new THREE.PlaneGeometry(20, 600);
      roadMesh = new THREE.Mesh(roadGeometry, new THREE.MeshLambertMaterial({ map: roadTexture }));
      roadMesh.rotation.x = -Math.PI / 2;
      scene.add(roadMesh);

      // Snake Head
      const loader = new GLTFLoader();
      loader.load('assets/Snake.glb', (gltf) => {
        snakeHead = gltf.scene;
        snakeHead.scale.set(2, 2, 2);
        snakeHead.position.set(0, 1.5, 0);
        scene.add(snakeHead);
        gameStarted = true;  // start game once head is loaded
      }, undefined, (err) => {
        console.error("Failed to load Snake.glb:", err);
      });

      // Initial body segment
      createBodySegment(0, -3);

      clock = new THREE.Clock();
      animate();
    }

    function createBodySegment(x, z) {
      const segmentGeo = new THREE.SphereGeometry(1.2, 8, 8);
      const segmentMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
      const segment = new THREE.Mesh(segmentGeo, segmentMat);
      segment.position.set(x, 1.5, z);
      scene.add(segment);
      bodySegments.push(segment);
    }

    function spawnRat() {
      const loader = new GLTFLoader();
      loader.load('assets/Rats.glb', (gltf) => {
        const rat = gltf.scene;
        rat.scale.set(1.5, 1.5, 1.5);
        rat.position.set(
          THREE.MathUtils.randFloat(-roadHalfWidth + 2, roadHalfWidth - 2),
          1.2,
          -150 - Math.random() * 50
        );
        scene.add(rat);
        rats.push(rat);
      }, undefined, (err) => {
        console.error("Failed to load Rats.glb:", err);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (gameStarted && !gameOver && snakeHead) {
        // Road scroll
        roadMesh.position.z += 40 * delta;
        if (roadMesh.position.z > 300) roadMesh.position.z -= 600;

        // Snake movement
        snakeCurrentX = THREE.MathUtils.lerp(snakeCurrentX, snakeTargetX, 0.2);
        snakeCurrentX = THREE.MathUtils.clamp(snakeCurrentX, -roadHalfWidth, roadHalfWidth);
        snakeHead.position.x = snakeCurrentX;

        // Body follow
        if (bodySegments.length > 0) {
          bodySegments[0].position.x = THREE.MathUtils.lerp(bodySegments[0].position.x, snakeHead.position.x, 0.3);
          bodySegments[0].position.z = snakeHead.position.z - 3;
          for (let i = 1; i < bodySegments.length; i++) {
            const prev = bodySegments[i-1].position;
            bodySegments[i].position.lerp(prev, 0.4);
          }
        }

        // Camera follow
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, snakeCurrentX * 0.6, 0.15);
        camera.lookAt(snakeCurrentX, 4, snakeHead.position.z - 15);

        // Spawn rats
        spawnTimer += delta;
        if (spawnTimer > 1.5) {
          spawnRat();
          spawnTimer = 0;
        }

        // Move rats toward snake (world-scroll simulation)
        rats.forEach((rat, i) => {
          rat.position.z += 40 * delta;

          const dist = snakeHead.position.distanceTo(rat.position);
          if (dist < 3) {
            // Eat rat
            score += 100;
            snakeLength++;
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snakeLength;
            createBodySegment(snakeCurrentX, snakeHead.position.z - snakeLength * 3);
            scene.remove(rat);
            rats.splice(i, 1);
          }
        });

        // Self-collision check
        bodySegments.forEach(seg => {
          if (snakeHead.position.distanceTo(seg.position) < 2.5 && seg !== bodySegments[0]) {
            endGame();
          }
        });

        // Out of bounds
        if (Math.abs(snakeCurrentX) > roadHalfWidth + 1) endGame();

        // Day/night cycle
        const elapsed = clock.getElapsedTime();
        const cycle = Math.floor(elapsed / 20) % 2;
        if (cycle !== (isNight ? 1 : 0)) {
          isNight = !isNight;
          updateFog();
          const dirLight = scene.children.find(c => c.type === 'DirectionalLight');
          if (dirLight) dirLight.color.setHSL(isNight ? 0.58 : 0.55, 1, isNight ? 0.4 : 0.8);
        }
      }

      renderer.render(scene, camera);
    }

    function updateFog() {
      scene.fog = new THREE.Fog(isNight ? 0x0a0a2a : 0x88aaff, 40, 280);
    }

    function endGame() {
      gameOver = true;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('ratsEaten').textContent = (snakeLength - 1);
      document.getElementById('gameOver').style.display = 'block';
    }

    // Input – left/right movement
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') snakeTargetX -= 3;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') snakeTargetX += 3;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
