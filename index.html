<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bike Dodger</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    #start {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    button {
      padding: 15px 30px;
      margin: 10px;
      background: #a77373;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }
    button:hover { background: #8b5a5a; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Speed: <span id="speed">30</span></div>
  </div>

  <div id="start">
    <h2>3D BIKE SIMULATOR 🏍️</h2>
    <p>Select your BG Music 🎶</p>
    <button onclick="startGame('game')">Game-Theme</button>
    <button onclick="startGame('phonk')">Phonk-Theme</button>
    <div style="font-size:14px; margin-top:20px; opacity:0.8;">
      Arrow Keys / A-D: Move left/right
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, roadMesh, bike, controls, clock;
    let gameStarted = false, isNight = false, score = 0, level = 1, roadSpeed = 30;
    let currentMusic = null;
    let bikeTargetX = 0;           // desired x position
    let bikeCurrentX = 0;          // smooth current position
    const roadHalfWidth = 10;      // clamp bike between -10 and +10

    function init() {
      scene = new THREE.Scene();
      updateFog();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0x80a0ff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Procedural road – higher res + seamless friendly
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Asphalt base
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, 0, 1024, 1024);

      // White dashed center line
      ctx.fillStyle = '#ffffff';
      const dashLength = 120;
      const gap = 80;
      for (let y = 0; y < 1024; y += dashLength + gap) {
        ctx.fillRect(480, y, 64, dashLength);
      }

      const roadTexture = new THREE.CanvasTexture(canvas);
      roadTexture.wrapS = roadTexture.wrapT = THREE.RepeatWrapping;
      roadTexture.repeat.set(4, 160);          // adjusted for higher res
      roadTexture.generateMipmaps = false;     // ← fixes most seam artifacts
      roadTexture.minFilter = THREE.LinearFilter;
      roadTexture.magFilter = THREE.LinearFilter;

      const roadGeometry = new THREE.PlaneGeometry(20, 600);
      roadMesh = new THREE.Mesh(
        roadGeometry,
        new THREE.MeshLambertMaterial({ map: roadTexture })
      );
      roadMesh.rotation.x = -Math.PI / 2;
      scene.add(roadMesh);

      // Lane lines (yellow)
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      [-6, 6].forEach(x => {
        const line = new THREE.Mesh(
          new THREE.PlaneGeometry(0.4, 600),
          lineMat
        );
        line.rotation.x = -Math.PI / 2;
        line.position.set(x, 0.02, 0);
        scene.add(line);
      });

      // Bike
      const loader = new GLTFLoader();
      loader.load('assets/bike.glb', (gltf) => {
        bike = gltf.scene;
        bike.scale.set(3, 3, 3);           // much bigger
        bike.position.set(0, 1.2, 0);
        bike.rotation.y = Math.PI;         // face forward
        scene.add(bike);
        console.log("Bike loaded successfully");
      }, undefined, (err) => {
        console.error("Failed to load bike:", err);
      });

      // Controls (for dev inspection – disabled in game)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 2, 0);

      clock = new THREE.Clock();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      controls.update();

      if (gameStarted && bike) {
        // Road scroll
        roadMesh.position.z += roadSpeed * delta;
        if (roadMesh.position.z > 300) roadMesh.position.z -= 600;

        // Smooth bike movement
        bikeCurrentX = THREE.MathUtils.lerp(bikeCurrentX, bikeTargetX, 0.18);
        bikeCurrentX = THREE.MathUtils.clamp(bikeCurrentX, -roadHalfWidth, roadHalfWidth);

        bike.position.x = bikeCurrentX;
        bike.rotation.z = THREE.MathUtils.lerp(bike.rotation.z, (bikeTargetX - bikeCurrentX) * 0.12, 0.25);

        // Camera follows bike
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, bikeCurrentX * 0.5, 0.1);
        camera.lookAt(bikeCurrentX, 3, bike.position.z - 8);

        // Score & level
        score += delta * 100;
        document.getElementById('score').textContent = Math.floor(score);
        document.getElementById('speed').textContent = Math.floor(roadSpeed);

        if (score > level * 1000) {
          level++;
          roadSpeed += 5;
          document.getElementById('level').textContent = level;
        }

        // Day/Night cycle
        const elapsed = clock.getElapsedTime();
        const cycle = Math.floor(elapsed / 20) % 2;
        if (cycle !== (isNight ? 1 : 0)) {
          isNight = !isNight;
          updateFog();
          const dirLight = scene.children.find(c => c.type === 'DirectionalLight');
          if (dirLight) dirLight.color.setHSL(isNight ? 0.58 : 0.55, 1, isNight ? 0.4 : 0.8);
        }
      }

      renderer.render(scene, camera);
    }

    function updateFog() {
      scene.fog = new THREE.Fog(isNight ? 0x0a0a2a : 0x88aaff, 40, 280);
    }

    window.startGame = function(type) {
      document.getElementById('start').style.display = 'none';

      const filename = type === 'game' ? 'Game-Theme.mp3' : 'Phonk-Theme.mp3';
      currentMusic = new Audio(`assets/${filename}`);
      currentMusic.volume = 0.5;
      currentMusic.loop = true;

      currentMusic.play().catch(e => {
        console.error("Audio play failed:", e);
        // Many browsers require another interaction after first load
        document.body.addEventListener('click', () => currentMusic.play(), {once: true});
      });

      gameStarted = true;
      controls.enabled = false; // lock orbit controls during play
    };

    // Input – smooth free movement
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (gameStarted) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') bikeTargetX -= 2;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') bikeTargetX += 2;
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
