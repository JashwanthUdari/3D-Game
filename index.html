<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Desert Snake Hunter</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui { 
      position:absolute; top:10px; left:10px; color:white; z-index:100; 
      font-size:22px; font-weight:bold; text-shadow:2px 2px 6px #000; 
    }
    #gameOver { 
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.92); color:white; padding:50px; border-radius:20px;
      text-align:center; display:none; z-index:200; min-width:320px;
    }
    button { 
      padding:18px 40px; background:#c0392b; color:white; border:none; 
      border-radius:10px; cursor:pointer; font-size:20px; margin-top:20px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Length: <span id="length">1</span></div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <p>Rats eaten: <span id="ratsEaten">0</span></p>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, groundMesh, snakeHead, clock;
    let score = 0, snakeLength = 1, time = 0;
    let snakeTargetX = 0, snakeCurrentX = 0;
    const roadHalfWidth = 12;
    let rats = [];
    let ratPool = [];
    let spawnTimer = 0;
    let gameOver = false;
    let gameStarted = false;

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xc9a87c, 60, 450); // warmer desert fog

      camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1200);
      camera.position.set(0, 5, 14); // closer & lower

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0xffd9a3, 0.7));
      const sun = new THREE.DirectionalLight(0xfff0c2, 1.4);
      sun.position.set(30, 50, 20);
      sun.castShadow = true;
      scene.add(sun);

      // Desert ground
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(1024, 1024);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const x = (i / 4) % 1024 / 1024;
        const y = Math.floor(i / 4 / 1024) / 1024;
        const n = Math.sin(x*12)*Math.sin(y*12)*0.4 + Math.sin((x+y)*25)*0.3 + 0.5;
        const col = 0xd4a373 + n * 0x503010;
        imgData.data[i]   = (col >> 16) & 255;
        imgData.data[i+1] = (col >> 8)  & 255;
        imgData.data[i+2] = col & 255;
        imgData.data[i+3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      const sandTex = new THREE.CanvasTexture(canvas);
      sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping;
      sandTex.repeat.set(10, 220);
      sandTex.generateMipmaps = false;

      const groundGeo = new THREE.PlaneGeometry(28, 1000);
      groundMesh = new THREE.Mesh(
        groundGeo,
        new THREE.MeshLambertMaterial({ map: sandTex })
      );
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      // Snake head (much larger)
      const loader = new GLTFLoader();
      loader.load('assets/Snake.glb', (gltf) => {
        snakeHead = gltf.scene;
        snakeHead.scale.set(4.5, 4.5, 4.5); // BIG now
        snakeHead.position.set(0, 3.5, 0);
        snakeHead.castShadow = true;
        scene.add(snakeHead);
        gameStarted = true;
      }, undefined, err => console.error("Snake load error:", err));

      // Rat pool
      for (let i = 0; i < 12; i++) {
        const ratLoader = new GLTFLoader();
        ratLoader.load('assets/Rats.glb', gltf => {
          const rat = gltf.scene;
          rat.scale.set(2.8, 2.8, 2.8); // larger rats
          rat.visible = false;
          scene.add(rat);
          ratPool.push(rat);
        });
      }

      clock = new THREE.Clock();
      animate();
    }

    function getPooledRat() {
      for (let rat of ratPool) {
        if (!rat.visible) return rat;
      }
      return null;
    }

    function spawnRat() {
      const rat = getPooledRat();
      if (rat) {
        rat.visible = true;
        rat.position.set(
          THREE.MathUtils.randFloatSpread(roadHalfWidth * 1.9),
          2.2,
          -180 - Math.random() * 80
        );
        rat.rotation.y = Math.random() * Math.PI * 2;
        rats.push(rat);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      time += delta;

      if (gameStarted && !gameOver && snakeHead) {
        // Ground scroll
        groundMesh.position.z += 48 * delta;
        if (groundMesh.position.z > 500) groundMesh.position.z -= 1000;

        // Snake movement
        snakeCurrentX = THREE.MathUtils.lerp(snakeCurrentX, snakeTargetX, 0.24);
        snakeCurrentX = THREE.MathUtils.clamp(snakeCurrentX, -roadHalfWidth + 2, roadHalfWidth - 2);
        snakeHead.position.x = snakeCurrentX;

        // Camera follow – closer, lower, more cinematic
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, snakeCurrentX * 0.65, 0.14);
        camera.position.y = 5.5 + Math.sin(time * 1.8) * 0.4;
        camera.lookAt(snakeCurrentX, 4, snakeHead.position.z - 18);

        // Spawn rats more frequently as snake grows
        spawnTimer += delta;
        if (spawnTimer > Math.max(0.7, 2.2 - snakeLength * 0.08)) {
          spawnRat();
          spawnTimer = 0;
        }

        // Rat movement & eating
        for (let i = rats.length - 1; i >= 0; i--) {
          const rat = rats[i];
          rat.position.z += 48 * delta;
          rat.rotation.y += delta * 4;

          if (rat.position.z > snakeHead.position.z + 10) {
            rat.visible = false;
            rats.splice(i, 1);
            continue;
          }

          if (snakeHead.position.distanceTo(rat.position) < 4.2) {
            score += 100;
            snakeLength++;
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snakeLength;
            rat.visible = false;
            rats.splice(i, 1);
          }
        }

        // Collision
        if (Math.abs(snakeCurrentX) > roadHalfWidth + 1) {
          gameOver = true;
          document.getElementById('finalScore').textContent = score;
          document.getElementById('ratsEaten').textContent = snakeLength - 1;
          document.getElementById('gameOver').style.display = 'block';
        }
      }

      renderer.render(scene, camera);
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') snakeTargetX -= 3;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') snakeTargetX += 3;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
