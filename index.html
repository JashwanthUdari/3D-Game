<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Desert Snake Hunter</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui { position:absolute; top:10px; left:10px; color:white; z-index:100; font-size:20px; font-weight:bold; text-shadow:2px 2px 4px #000; }
    #gameOver { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; padding:40px; border-radius:15px; text-align:center; display:none; z-index:200; }
    button { padding:15px 30px; background:#a77373; color:white; border:none; border-radius:8px; cursor:pointer; font-size:18px; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Length: <span id="length">1</span></div>
  </div>
  <div id="gameOver">
    <h2>GAME OVER 🐍</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <p>Rats Eaten: <span id="ratsEaten">0</span></p>
    <button onclick="location.reload()">RESTART</button>
  </div>

  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, groundMesh, snakeHead, clock;
    let score = 0, snakeLength = 1, time = 0;
    let snakeTargetX = 0, snakeCurrentX = 0;
    const roadHalfWidth = 12;
    let bodySegments = [];
    let rats = [];
    let ratPool = [];
    let spawnTimer = 0, gameOver = false, gameStarted = false;

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xc2b280, 50, 400);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);

      // Desert lights
      const ambient = new THREE.AmbientLight(0xffd700, 0.6);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xffa500, 1.2);
      sun.position.set(20, 30, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 2048;
      scene.add(sun);

      // Desert sand (procedural dunes)
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const imageData = ctx.createImageData(1024, 1024);
      for (let i = 0; i < imageData.data.length; i += 4) {
        const x = (i / 4 % 1024) / 1024, y = Math.floor(i / 4 / 1024) / 1024;
        const noise = Math.sin(x * 10) * Math.sin(y * 10) * 0.5 + 0.5 + Math.sin((x + y) * 20) * 0.2;
        const color = 0xd2b48c + noise * 0x404040;
        imageData.data[i] = (color >> 16) & 255;     // R
        imageData.data[i+1] = (color >> 8) & 255;    // G
        imageData.data[i+2] = color & 255;           // B
        imageData.data[i+3] = 255;                   // A
      }
      ctx.putImageData(imageData, 0, 0);
      const sandTexture = new THREE.CanvasTexture(canvas);
      sandTexture.wrapS = sandTexture.wrapT = THREE.RepeatWrapping;
      sandTexture.repeat.set(8, 200);
      sandTexture.generateMipmaps = false;
      sandTexture.minFilter = THREE.LinearFilter;

      const groundGeometry = new THREE.PlaneGeometry(24, 800);
      groundMesh = new THREE.Mesh(groundGeometry, new THREE.MeshLambertMaterial({ map: sandTexture }));
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      // Snake Head
      const loader = new GLTFLoader();
      loader.load('assets/Snake.glb', (gltf) => {
        snakeHead = gltf.scene;
        snakeHead.scale.set(1, 1, 1);  // Smaller!
        snakeHead.position.set(0, 2, 0);
        snakeHead.castShadow = true;
        scene.add(snakeHead);
        gameStarted = true;
      });

      // Pre-create rat pool
      for (let i = 0; i < 15; i++) {
        const ratLoader = new GLTFLoader();
        ratLoader.load('assets/Rats.glb', (gltf) => {
          const rat = gltf.scene;
          rat.scale.set(1.2, 1.2, 1.2);
          rat.visible = false;
          scene.add(rat);
          ratPool.push(rat);
        });
      }

      // Initial tail
      createBodySegment(0, -4);

      clock = new THREE.Clock();
      animate();
    }

    function createBodySegment(x, zOffset) {
      if (bodySegments.length > 50) {  // Cap length for perf
        const oldTail = bodySegments.shift();
        scene.remove(oldTail);
      }
      const segmentGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
      const segmentMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
      const segment = new THREE.Mesh(segmentGeo, segmentMat);
      segment.position.set(x, 2, zOffset);
      segment.castShadow = true;
      scene.add(segment);
      bodySegments.push({ mesh: segment, phase: bodySegments.length * 0.5 });
    }

    function getPooledRat() {
      for (let rat of ratPool) {
        if (!rat.visible) return rat;
      }
      return null;
    }

    function spawnRat() {
      const rat = getPooledRat();
      if (rat) {
        rat.visible = true;
        rat.position.set(
          THREE.MathUtils.randFloatSpread(roadHalfWidth * 1.8),
          1.8,
          -120 - Math.random() * 60
        );
        rat.rotation.y = Math.random() * Math.PI * 2;
        rats.push(rat);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      time += delta;

      if (gameStarted && !gameOver && snakeHead) {
        // Ground scroll
        groundMesh.position.z += 45 * delta;
        if (groundMesh.position.z > 400) groundMesh.position.z -= 800;

        // Head movement
        snakeCurrentX = THREE.MathUtils.lerp(snakeCurrentX, snakeTargetX, 0.22);
        snakeCurrentX = THREE.MathUtils.clamp(snakeCurrentX, -roadHalfWidth + 1, roadHalfWidth - 1);
        snakeHead.position.x = snakeCurrentX;
        snakeHead.rotation.z = (snakeTargetX - snakeCurrentX) * 0.3;

        // Realistic slither body (sine wave undulation)
        const headPos = snakeHead.position.clone();
        if (bodySegments.length > 0) {
          for (let i = 0; i < bodySegments.length; i++) {
            const seg = bodySegments[i];
            const targetZ = headPos.z - (i + 1) * 3.2;
            const wave = Math.sin(time * 4 + seg.phase) * 1.2;
            const wave2 = Math.sin(time * 6 + seg.phase * 1.3) * 0.8;
            seg.mesh.position.x = THREE.MathUtils.lerp(seg.mesh.position.x, snakeCurrentX + wave * 0.6, 0.25);
            seg.mesh.position.y = 2 + wave2 * 0.4;
            seg.mesh.position.z = THREE.MathUtils.lerp(seg.mesh.position.z, targetZ, 0.35);
            seg.mesh.rotation.z = wave * 0.4;
            seg.mesh.rotation.y = wave2 * 0.2;
          }
        }

        // Camera smooth follow
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, snakeCurrentX * 0.7, 0.12);
        camera.position.y = 6 + Math.sin(time * 2) * 0.3;
        camera.lookAt(snakeCurrentX, 3, headPos.z - 12);

        // Spawn rats (faster with length)
        spawnTimer += delta;
        if (spawnTimer > Math.max(0.8, 2 - snakeLength * 0.05)) {
          spawnRat();
          spawnTimer = 0;
        }

        // Rat movement & eat check
        for (let i = rats.length - 1; i >= 0; i--) {
          const rat = rats[i];
          rat.position.z += 45 * delta;
          rat.rotation.y += delta * 3;  // Spin for fun

          if (rat.position.z > headPos.z + 5) {  // Past snake
            rat.visible = false;
            rats.splice(i, 1);
            continue;
          }

          const dist = snakeHead.position.distanceTo(rat.position);
          if (dist < 2.8) {
            // Eat!
            score += 100;
            snakeLength++;
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snakeLength;
            createBodySegment(snakeCurrentX, headPos.z - snakeLength * 3);
            rat.visible = false;
            rats.splice(i, 1);
          }
        }

        // Collision checks
        bodySegments.forEach(seg => {
          if (snakeHead.position.distanceTo(seg.mesh.position) < 2.2) endGame();
        });
        if (Math.abs(snakeCurrentX) > roadHalfWidth) endGame();
      }

      renderer.render(scene, camera);
    }

    function endGame() {
      gameOver = true;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('ratsEaten').textContent = snakeLength - 1;
      document.getElementById('gameOver').style.display = 'block';
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') snakeTargetX -= 2.5;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') snakeTargetX += 2.5;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
