<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bike Dodger</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
    #ui { position:absolute; top:10px; left:10px; color:white; z-index:100; font-size:20px; font-weight:bold; text-shadow:2px 2px 4px #000; }
    #start { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); color:white; padding:30px; border-radius:15px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.8); }
    button { padding:15px 30px; margin:10px; background:#a77373; color:white; border:none; border-radius:8px; cursor:pointer; font-size:18px; }
    button:hover { background:#8b5a5a; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div>Speed: <span id="speed">30</span></div>
  </div>
  <div id="start">
    <h2>3D BIKE SIMULATOR 🚀</h2>
    <p>Select your BG Music 🎶</p>
    <button onclick="startGame('game')">Game-Theme</button>
    <button onclick="startGame('phonk')">Phonk-Theme</button>
    <div style="font-size:14px; margin-top:20px; opacity:0.8;">Arrow Keys / A-D: Change lanes</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, roadMesh, bike, controls, clock;
    let gameStarted = false, isNight = false, score = 0, level = 1, roadSpeed = 30;
    let currentLane = 0; // 0 = left, 1 = middle, 2 = right
    const lanes = [-8, 0, 8];
    let currentMusic = null;

    function init() {
      scene = new THREE.Scene();
      updateFog();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 15);

      renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0x80a0ff, 0.4));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10,20,10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Road (same as before)
      const roadGeometry = new THREE.PlaneGeometry(20, 400);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#333333'; ctx.fillRect(0,0,512,512);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 512; i += 128) ctx.fillRect(200, i, 120, 60);
      const roadTexture = new THREE.CanvasTexture(canvas);
      roadTexture.wrapS = roadTexture.wrapT = THREE.RepeatWrapping;
      roadTexture.repeat.set(3,80);
      roadMesh = new THREE.Mesh(roadGeometry, new THREE.MeshLambertMaterial({ map: roadTexture }));
      roadMesh.rotation.x = -Math.PI/2;
      scene.add(roadMesh);

      // Lane lines
      const lineMat = new THREE.MeshBasicMaterial({color:0xffff00});
      lanes.forEach(x => {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.4,400), lineMat);
        line.rotation.x = -Math.PI/2;
        line.position.set(x, 0.02, 0);
        scene.add(line);
      });

      // Bike
      const loader = new GLTFLoader();
      loader.load('assets/bike.glb', (gltf) => {
        bike = gltf.scene;
        bike.scale.set(1.2, 1.2, 1.2);
        bike.position.set(0, 1.2, 0);
        bike.rotation.y = Math.PI; // face forward
        scene.add(bike);
        console.log("Bike loaded!");
      }, undefined, err => console.error("Bike load error:", err));

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0,2,0);

      clock = new THREE.Clock();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      controls.update();

      if (gameStarted && bike) {
        roadMesh.position.z += roadSpeed * delta;
        if (roadMesh.position.z > 200) roadMesh.position.z -= 400;

        // Lane movement
        let targetX = lanes[currentLane];
        bike.position.x = THREE.MathUtils.lerp(bike.position.x, targetX, 0.2);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetX * 0.6, 0.15);
        camera.lookAt(bike.position.x, 3, bike.position.z - 10);

        // Lean animation
        bike.rotation.z = THREE.MathUtils.lerp(bike.rotation.z, (targetX - bike.position.x) * 0.08, 0.3);

        // Score & level
        score += delta * 100;
        document.getElementById('score').textContent = Math.floor(score);
        if (score > level * 1000) {
          level++;
          roadSpeed += 4;
          document.getElementById('level').textContent = level;
        }
      }

      renderer.render(scene, camera);
    }

    // Music (with error handling)
    window.startGame = function(type) {
      document.getElementById('start').style.display = 'none';
      const filename = type === 'game' ? 'Game-Theme.mp3' : 'Phonk-Theme.mp3';
      currentMusic = new Audio(`assets/${filename}`);
      currentMusic.volume = 0.5;
      currentMusic.loop = true;
      currentMusic.play().catch(e => console.error(e));
      gameStarted = true;
      controls.enabled = false;
    };

    function updateFog() { /* same as before */ }
    // (copy the toggleDayNight and updateFog from previous code if you want day/night)

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Keyboard lane change
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (gameStarted) {
        if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && currentLane > 0) currentLane--;
        if ((e.code === 'ArrowRight' || e.code === 'KeyD') && currentLane < 2) currentLane++;
      }
    });

    init();
  </script>
</body>
</html>
